name: Rust

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Install Target
      run: rustup target install thumbv7em-none-eabihf
    - uses: actions/checkout@v1
    - name: Build
      run: cargo build --target=thumbv7em-none-eabihf
    - name: Clippy
      run: cargo clippy -- -Dwarnings
    - name: Fmt
      run: cargo fmt --check
